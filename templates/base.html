<!doctype html>

<html>

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Travel Document Assistant</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #18202a;
        }

        nav {
            padding: 16px 7%;
            background: #111827;
        }

        nav a {
            color: white;
            margin-right: 18px;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 900px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 14px;
        }

        textarea,
        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        pre {
            white-space: pre-wrap;
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            padding: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-decoration: none;
            color: #18202a;
        }

        .card:hover {
            background: #f5f7fb;
        }

        @media(max-width: 700px) {

            .grid {
                grid-template-columns: 1fr;
            }

            nav a {
                display: inline-block;
                margin-bottom: 8px;
            }

        }

    </style>

</head>

<body>

    <nav>

        <a href="/">Home</a>

        <a href="/chat">Travel Chat</a>

        <a href="/document-analysis">Document Analysis</a>

        <a href="/vision">Vision</a>

    </nav>


    <main>

        {% block content %}

        {% endblock %}

    </main>

</body>

</html>
